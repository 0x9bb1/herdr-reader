[package]
name = "herdr-reader"
version = "0.1.0"
edition = "2021"
description = "A herdr plugin that shows a book one line at a time, disguised as log output."
license = "MIT"
repository = "https://github.com/0x9bb1/herdr-reader"

[dependencies]
anyhow = "1"
crossterm = "0.28"
encoding_rs = "0.8"
libc = "0.2"
pdf-extract = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
unicode-width = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
strip = true
